version: '3.8'

services:
  api:
    build: .
    ports:
      - "443:443"
    environment:
      - PORT=443
      - LOG_LEVEL=INFO
      - API_KEY=${API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - ./data:/app/data:ro
      - audit_logs:/app/audit_logs
      - /path/to/valid/certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "--cacert", "/app/certs/certificate.crt", "https://localhost:443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  audit_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/audit_logs